; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = camara_esp_video
; Permite seleccionar src/ o una carpeta de test/ segun el entorno.
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter =
    -<*>
    +<src/>
lib_deps = 
	adafruit/DHT sensor library@^1.4.7
	madhephaestus/ESP32Servo@^3.2.1
	knolleary/PubSubClient@^2.8
monitor_speed = 9600
monitor_filters = send_on_enter
monitor_echo = yes

[env:esp32s3_mqtt]
extends = env:esp32dev
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps =
    ${env:esp32dev.lib_deps}
    adafruit/Adafruit NeoPixel@^1.15.0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0



[env:microfono]
; Arduino-ESP32 3.3.12 incluye ESP_SR y carga srmodels.bin automaticamente.
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 N16R8
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = esp_sr_16.csv
build_unflags = -DCORE_DEBUG_LEVEL=0
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial por el USB nativo del ESP32-S3 (puerto usbmodem).
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Prueba manual del microfono: compilar solo test/microfono/
build_src_filter =
    -<*>
    +<test/microfono/>

; Monitor serial
monitor_speed = 115200

; Velocidad de carga
upload_speed = 921600

; Diagnostico independiente: solo camara y pagina web, sin modelos ni QR.
[env:camara_web]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_unflags = -DCORE_DEBUG_LEVEL=0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
build_src_filter =
    -<*>
    +<test/camara_web/>
monitor_speed = 115200
upload_speed = 921600

; Comparacion de captura: mismos pines, reloj y resolucion; formato RGB565.
[env:camara_web_rgb]
extends = env:camara_web
build_flags =
    ${env:camara_web.build_flags}
    -DCAMARA_RGB565=1

; Mismo test JPEG, comparando con Arduino 2.0.17 / ESP-IDF 4.4.7.
; No cambia el framework de los entornos camara y microfono.
[env:camara_web_arduino2]
extends = env:camara_web
platform = espressif32@6.12.0

; Otra pila de captura: ESP_Video -> esp_video -> esp_cam_sensor (DVP).
[env:camara_esp_video]
extends = env:camara_web
platform = espressif32@8.0.0
build_src_filter =
    -<*>
    +<test/camara_esp_video/>

[env:camara]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.embed_files = test/camara/models/human_face_detect.espdl

; ESP32-S3 N16R8: 16 MB de flash y 8 MB de PSRAM OPI.
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_unflags = -DCORE_DEBUG_LEVEL=0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DQUIRC_FLOAT_TYPE=float
    -DQUIRC_USE_TGMATH
    -DCORE_DEBUG_LEVEL=3

; Prueba manual de la camara: compilar solo test/camara/.
build_src_filter =
    -<*>
    +<test/camara/>

monitor_speed = 115200
upload_speed = 921600
