; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = kuby
src_dir = .

[env]
framework = arduino
monitor_filters = send_on_enter
monitor_echo = yes
monitor_speed = 115200

[env:esp32]
platform = espressif32
board = esp32dev

[env:esp32n16r8]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags = 
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 921600

[env:kuby]
extends = env:esp32n16r8
build_src_filter = 
	-<*>
	+<src/>
lib_deps = 
	adafruit/DHT sensor library@^1.4.7
	madhephaestus/ESP32Servo@^3.2.1
	fastled/FastLED@^3.10.9
	adafruit/Adafruit PN532@^1.3.4
	arduino-libraries/Stepper@^1.1.3

[env:leds]
extends = env:esp32n16r8
build_src_filter =
	-<*>
	+<test/leds/>
lib_deps =
	fastled/FastLED@^3.10.9

[env:stepper]
extends = env:esp32n16r8
build_src_filter =
	-<*>
	+<test/stepper/>
lib_deps =
	arduino-libraries/Stepper@^1.1.3

[env:servo]
extends = env:esp32n16r8
build_src_filter =
	-<*>
	+<test/servo/>
lib_deps =
	madhephaestus/ESP32Servo@^3.2.1

[env:nfc_rfid]
extends = env:esp32n16r8
build_src_filter =
	-<*>
	+<test/nfc_rfid/>
lib_deps =
	adafruit/Adafruit PN532@^1.3.4
	madhephaestus/ESP32Servo@^3.2.1

[env:microfono]
extends = env:esp32n16r8
board_build.partitions = esp_sr_16.csv
build_unflags = -D CORE_DEBUG_LEVEL=0
build_flags = 
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=3
build_src_filter = 
	-<*>
	+<test/microfono/>

[env:camara]
extends = env:esp32n16r8
board_build.embed_files = test/camara/models/human_face_detect.espdl
build_unflags = -DCORE_DEBUG_LEVEL=0
build_flags = 
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D QUIRC_FLOAT_TYPE=float
	-D QUIRC_USE_TGMATH
	-D CORE_DEBUG_LEVEL=3
build_src_filter = 
	-<*>
	+<test/camara/>
lib_deps = 
	fastled/FastLED@^3.10.9
	adafruit/Adafruit PN532@^1.3.4
	arduino-libraries/Stepper@^1.1.3

