; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = microfono
; Permite seleccionar src/ o test/microfono/ segun el entorno.
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter =
    -<*>
    +<src/>
lib_deps = 
	adafruit/DHT sensor library@^1.4.7
	madhephaestus/ESP32Servo@^3.2.1
monitor_filters = send_on_enter
monitor_echo = yes



[env:microfono]
; Arduino-ESP32 3.3.12 incluye ESP_SR y carga srmodels.bin automaticamente.
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 N16R8
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = esp_sr_16.csv
build_unflags = -DCORE_DEBUG_LEVEL=0
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial por el USB nativo del ESP32-S3 (puerto usbmodem).
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Prueba manual del microfono: compilar solo test/microfono/
build_src_filter =
    -<*>
    +<test/microfono/>

; Monitor serial
monitor_speed = 115200

; Velocidad de carga
upload_speed = 921600
